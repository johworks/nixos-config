<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3840" height="2160" viewBox="0 0 2560 1440" role="img"
     aria-labelledby="title description">
  <title id="title">The Quiet Kingdom</title>
  <desc id="description">A tiny blue knight and two penguins look across a frozen river
    toward a crooked ice castle. Moonlight, pale aurora ribbons and snow soften the
    jagged mountains of a whimsical winter kingdom.</desc>
  <defs>
