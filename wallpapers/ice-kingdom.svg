      <stop offset="1" stop-color="#ace2df" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aurora" x1="0" y1="1" x2=".2" y2="0">
      <stop stop-color="#7ce4cf" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7ce4cf" stop-opacity="0"/>
    </linearGradient>
