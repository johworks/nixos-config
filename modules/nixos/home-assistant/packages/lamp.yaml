homeassistant:
  customize:
    switch.james_and_johns_room_kauf_plug_johns_ac:
      friendly_name: Lamp
      icon: mdi:lamp

input_boolean:
  lamp_schedule_enabled:
    name: Lamp schedule
    icon: mdi:calendar-clock

input_datetime:
  lamp_on_time:
    name: Turn on at
    has_date: false
    has_time: true
  lamp_off_time:
    name: Turn off at
    has_date: false
    has_time: true

automation:
  - id: lamp_schedule_on
    alias: Turn on the lamp on schedule
    triggers:
      - trigger: time
        at: input_datetime.lamp_on_time
    conditions:
      - condition: state
        entity_id: input_boolean.lamp_schedule_enabled
        state: "on"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.james_and_johns_room_kauf_plug_johns_ac

  - id: lamp_schedule_off
    alias: Turn off the lamp on schedule
    triggers:
      - trigger: time
        at: input_datetime.lamp_off_time
    conditions:
      - condition: state
        entity_id: input_boolean.lamp_schedule_enabled
        state: "on"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.james_and_johns_room_kauf_plug_johns_ac
